name: Release

on:
  push:
    tags:
      - '**'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true # Need to get the submodule tag for the CMake builds.
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
          cache-dependency-path: |
            core/src/main/golang/go.sum
            core/src/foss/golang/go.sum
            core/src/foss/golang/clash/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          ./gradlew app:assembleRelease
      - name: Create release
        if: github.repository_owner == 'Goooler'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} "./app/build/outputs/apk/release/"*.apk --generate-notes
