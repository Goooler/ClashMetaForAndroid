name: Release

on:
  push:
    tags:
      - '**'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # TODO: https://github.com/actions/checkout/issues/435
      - name: Get the submodule tag for CMake build
        run: git submodule foreach --recursive 'git fetch --tags --force'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache: true
          cache-dependency-path: |
            core/src/main/golang/go.sum
            core/src/foss/golang/go.sum
            core/src/foss/golang/clash/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          ./gradlew androidApp:assembleRelease --no-daemon
      - name: Create release
        if: github.repository_owner == 'Goooler'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} "./androidApp/build/outputs/apk/release/"*.apk --generate-notes
