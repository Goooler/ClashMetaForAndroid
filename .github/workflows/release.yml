name: Release

on:
  push:
    tags:
      - '**'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: |
          ./gradlew app:assembleMetaRelease
      - name: Create release
        if: github.repository == 'Goooler/ClashMetaForAndroid'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} "./app/build/outputs/apk/meta/release/"*.apk --generate-notes
