name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - trunk

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true
          cache-dependency-path: |
            core/src/main/golang/go.sum
            core/src/foss/golang/go.sum
            core/src/foss/golang/clash/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck
      - name: Build
        run: |
          ./gradlew app:assembleRelease
      - name: Delete release if exist then create release
        if: github.repository == 'Goooler/MihomoForAndroid' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly && gh release delete nightly -y --cleanup-tag
          gh release create nightly "./app/build/outputs/apk/release/"*.apk --prerelease --generate-notes
