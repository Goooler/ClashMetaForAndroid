name: Update Clash-Core and Go Modules

on:
  push:
    branches:
      - trunk
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update-go-dependencies:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Goooler'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
      - name: Install update-go-mod-replace
        run: |
          go install github.com/metacubex/update-go-mod-replace@latest
      - name: Update Foss Gomod
        run: |
          cd ./core/src/foss/golang/
          update-go-mod-replace ./core/src/foss/golang/clash/go.mod $(pwd)/go.mod
          go mod tidy
      - name: Update Main Gomod
        run: |
          cd ./core/src/main/golang/
          update-go-mod-replace ./core/src/foss/golang/clash/go.mod $(pwd)/go.mod
          go mod tidy
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@v8
        id: create-pull-request
        with:
          commit-message: |
            Update Go dependencies

            _Auto-generated by `update-go-dependencies` workflow._
          title: Update Go dependencies
          body: _Auto-generated by `update-go-dependencies` workflow._
          branch: actions/update-go-dependencies
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com> # Same as `committer`.'
          token: ${{ steps.app-token.outputs.token }}
          labels: Update
          delete-branch: true
      - name: Merge Pull Request
        if: steps.create-pull-request.outputs.pull-request-number != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge ${{ steps.create-pull-request.outputs.pull-request-number }} --auto
