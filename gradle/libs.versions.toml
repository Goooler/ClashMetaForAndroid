[versions]
agp = "9.1.1"
kotlin = "2.3.20"
kaidl = "0.1.0"
room = "2.8.4"
okhttp = "5.3.2"
jvmTarget = "21"

[libraries]
kotlin-coroutine = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
kotlin-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"

androidx-core = "androidx.core:core:1.19.0-alpha01"
androidx-activity = "androidx.activity:activity:1.13.0"
androidx-fragment = "androidx.fragment:fragment:1.8.9"
androidx-appcompat = "androidx.appcompat:appcompat:1.7.1"
androidx-coordinator = "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.4.0"
androidx-viewpager = "androidx.viewpager2:viewpager2:1.1.0"
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

google-material = "com.google.android.material:material:1.13.0"
kaidl-compiler = { module = "io.github.goooler.kaidl:kaidl-compiler", version.ref = "kaidl" }
kaidl-runtime = { module = "io.github.goooler.kaidl:kaidl-runtime", version.ref = "kaidl" }
rikkax-multiprocess = "dev.rikka.rikkax.preference:multiprocess:1.0.0"
quickie-bundled = "io.github.g00fy2.quickie:quickie-bundled:1.11.0"
okhttp-client = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Dummy to get renovate updates, the version is used in rootProject build.gradle with spotless.
ktfmt = "com.facebook:ktfmt:0.62"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-legacyKapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = "com.google.devtools.ksp:2.3.6"
golang = "io.github.goooler.golang:0.1.2"
download = "de.undercouch.download:5.7.0"
spotless = "com.diffplug.spotless:8.4.0"
